name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.5']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd, zip, intl
          coverage: none

      - name: Validate composer manifests
        run: |
          composer validate --strict
          composer validate --strict packages/platform/composer.json
          composer validate --strict packages/api-platform/composer.json
          composer validate --strict packages/admin-bundle/composer.json
          composer validate --strict packages/sequence-bundle/composer.json
          composer validate --strict packages/tenant-bundle/composer.json
          composer validate --strict packages/workflow-bundle/composer.json

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Audit dependencies
        run: composer audit

      - name: Mago lint
        run: vendor/bin/mago lint

      - name: Mago format check
        run: vendor/bin/mago fmt --dry-run

      - name: Static analysis (no new issues)
        run: composer stan

      - name: PHPUnit (unit)
        run: vendor/bin/phpunit --exclude-testsuite integration

  integration:
    name: Integration (PHP ${{ matrix.php-version }}, PostgreSQL)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.5']
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration
          POSTGRES_DB: integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # IntegrationTestCase fails rather than skips when this is missing in CI:
      # a silently skipped isolation suite looks identical to a passing one.
      NUBIT_TEST_DATABASE_URL: 'postgresql://integration:integration@127.0.0.1:5432/integration?serverVersion=16&charset=utf8'
      NUBIT_TEST_DATABASE_HOST: 127.0.0.1
      NUBIT_TEST_DATABASE_USER: integration
      NUBIT_TEST_DATABASE_PASSWORD: integration
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd, zip, intl, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: PHPUnit (integration)
        # Each test compiles its own container, and PHP cannot unload one once
        # loaded. The ceiling is the suite's shape, not a leak.
        run: php -d memory_limit=512M vendor/bin/phpunit --testsuite integration

  package-isolation:
    name: Package isolation (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - platform
          - api-platform
          - admin-bundle
          - sequence-bundle
          - tenant-bundle
          - workflow-bundle
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd, zip, intl
          coverage: none

      - name: Validate package manifest
        run: composer validate --strict

      # Each sibling is wired as a path repository with an explicit version,
      # because a path repo has no tag to infer one from. That version has to
      # satisfy the internal constraints in the package manifests — when those
      # moved to ^1.0 while this said 0.15.2, every isolation job failed to
      # resolve. Keep SIBLING_VERSION at the line being developed.
      - name: Wire current sibling packages
        env:
          SIBLING_VERSION: '1.0.1'
        run: |
          set -eu
          for package in platform api-platform admin-bundle sequence-bundle tenant-bundle workflow-bundle; do
            composer config "repositories.local-$package" \
              "{\"type\":\"path\",\"url\":\"../$package\",\"options\":{\"versions\":{\"nubitio/$package\":\"$SIBLING_VERSION\"}}}"
          done

      - name: Install package in isolation
        run: composer install --no-interaction --prefer-dist

      - name: Run package tests
        run: vendor/bin/phpunit tests --fail-on-phpunit-deprecation --fail-on-phpunit-notice
